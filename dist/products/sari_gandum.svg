<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wheatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="biscuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="biscShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="32" fill="url(#wheatBg)"/>

  <!-- Wheat stalk in background -->
  <path d="M160 80 Q150 40 170 20" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.6"/>
  <ellipse cx="158" cy="45" rx="5" ry="9" fill="#f59e0b" opacity="0.5" transform="rotate(-30 158 45)"/>
  <ellipse cx="166" cy="35" rx="5" ry="9" fill="#f59e0b" opacity="0.5" transform="rotate(30 166 35)"/>

  <!-- Biscuit Sandwich Stack -->
  <g filter="url(#biscShadow)">
    <!-- Bottom Biscuit Layer -->
    <ellipse cx="98" cy="115" rx="52" ry="24" fill="url(#biscuitGrad)"/>
    
    <!-- Rich Chocolate Cream Center Layer -->
    <ellipse cx="100" cy="107" rx="50" ry="22" fill="#451a03"/>
    <ellipse cx="100" cy="107" rx="46" ry="19" fill="#291104"/>

    <!-- Top Biscuit Layer -->
    <ellipse cx="102" cy="98" rx="52" ry="24" fill="url(#biscuitGrad)"/>
    
    <!-- Biscuit Texture Holes (Punctures) -->
    <circle cx="75" cy="92" r="2.5" fill="#78350f"/>
    <circle cx="95" cy="88" r="2.5" fill="#78350f"/>
    <circle cx="115" cy="88" r="2.5" fill="#78350f"/>
    <circle cx="130" cy="92" r="2.5" fill="#78350f"/>

    <circle cx="85" cy="99" r="2.5" fill="#78350f"/>
    <circle cx="103" cy="97" r="3" fill="#78350f"/>
    <circle cx="122" cy="99" r="2.5" fill="#78350f"/>

    <circle cx="78" cy="106" r="2.5" fill="#78350f"/>
    <circle cx="98" cy="106" r="2.5" fill="#78350f"/>
    <circle cx="118" cy="106" r="2.5" fill="#78350f"/>

    <!-- Wheat grains on top -->
    <ellipse cx="90" cy="82" rx="3" ry="5" fill="#fef3c7" transform="rotate(25 90 82)"/>
    <ellipse cx="112" cy="80" rx="3" ry="5" fill="#fef3c7" transform="rotate(-30 112 80)"/>
  </g>

  <!-- Product Label Banner -->
  <rect x="25" y="152" width="150" height="32" rx="12" fill="#b45309" filter="url(#biscShadow)"/>
  <text x="100" y="173" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">SARI GANDUM</text>
</svg>
