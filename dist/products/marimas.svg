<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sachetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="200" height="200" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Citrus Fruit Accents -->
  <circle cx="150" cy="50" r="28" fill="#fdba74" opacity="0.6"/>
  <circle cx="150" cy="50" r="22" fill="#fed7aa" opacity="0.8"/>
  <path d="M150 28 L150 72 M128 50 L172 50 M134 34 L166 66 M134 66 L166 34" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>

  <!-- Drink Glass -->
  <g filter="url(#shadow)">
    <!-- Glass Body -->
    <path d="M65 85 L75 165 Q77 175 90 175 L125 175 Q138 175 140 165 L150 85 Z" fill="url(#cupGrad)"/>
    <!-- Glass Rim -->
    <ellipse cx="107.5" cy="85" rx="42.5" ry="10" fill="#fed7aa"/>
    <ellipse cx="107.5" cy="85" rx="37" ry="8" fill="#ea580c"/>
    
    <!-- Ice Cubes inside glass -->
    <rect x="85" y="100" width="22" height="20" rx="4" fill="#ffffff" opacity="0.75" transform="rotate(-10 96 110)"/>
    <rect x="112" y="115" width="20" height="18" rx="4" fill="#ffffff" opacity="0.75" transform="rotate(15 122 124)"/>
    <rect x="90" y="132" width="22" height="20" rx="4" fill="#ffffff" opacity="0.6" transform="rotate(5 101 142)"/>
    
    <!-- Straw -->
    <path d="M125 40 L115 95" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M125 40 L140 25" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M122 43 L124 39" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Marimas Sachet on side -->
  <g filter="url(#shadow)" transform="rotate(-15 45 110)">
    <rect x="25" y="70" width="42" height="60" rx="4" fill="url(#sachetGrad)"/>
    <rect x="25" y="66" width="42" height="5" fill="#f59e0b"/>
    <rect x="25" y="129" width="42" height="5" fill="#f59e0b"/>
    <rect x="28" y="76" width="36" height="24" rx="3" fill="#ffffff"/>
    <text x="46" y="92" font-family="sans-serif" font-weight="900" font-size="9" fill="#ea580c" text-anchor="middle">MARIMAS</text>
    <circle cx="46" cy="112" r="8" fill="#ea580c"/>
    <text x="46" y="116" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">🍊</text>
  </g>

  <!-- Product Label Banner -->
  <rect x="20" y="152" width="160" height="32" rx="12" fill="#ea580c" filter="url(#shadow)"/>
  <text x="100" y="173" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARIMAS SEGAR</text>
</svg>
