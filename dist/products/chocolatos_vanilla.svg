<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vanillaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="stickVanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fillVanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <filter id="vanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="32" fill="url(#vanillaBg)"/>

  <!-- Vanilla Flower Petals in background -->
  <circle cx="160" cy="45" r="16" fill="#fef08a" opacity="0.8"/>
  <circle cx="150" cy="35" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="170" cy="35" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="160" cy="55" r="10" fill="#ffffff" opacity="0.9"/>

  <!-- Chocolatos Vanilla Wafer Rolls (Diagonal) -->
  <g filter="url(#vanShadow)">
    <!-- Wafer Stick 1 -->
    <g transform="rotate(-35 100 100)">
      <!-- Outer Tube -->
      <rect x="30" y="80" width="140" height="24" rx="12" fill="url(#stickVanGrad)"/>
      <!-- Striped Spirals -->
      <path d="M45 80 L35 104 M65 80 L55 104 M85 80 L75 104 M105 80 L95 104 M125 80 L115 104 M145 80 L135 104" stroke="#b45309" stroke-width="3.5"/>
      <!-- Tip Hollow / Vanilla Cream Filling -->
      <ellipse cx="165" cy="92" rx="6" ry="12" fill="url(#fillVanGrad)"/>
      <ellipse cx="165" cy="92" rx="4" ry="9" fill="#ffffff"/>
    </g>

    <!-- Wafer Stick 2 behind -->
    <g transform="rotate(-20 100 115)">
      <rect x="25" y="105" width="135" height="20" rx="10" fill="url(#stickVanGrad)"/>
      <path d="M45 105 L35 125 M65 105 L55 125 M85 105 L75 125 M105 105 L95 125 M125 105 L115 125" stroke="#b45309" stroke-width="3"/>
      <ellipse cx="155" cy="115" rx="5" ry="10" fill="#ffffff"/>
    </g>

    <!-- Vanilla Cream Drops -->
    <circle cx="165" cy="78" r="5" fill="#ffffff"/>
    <circle cx="178" cy="92" r="4" fill="#fef9c3"/>
  </g>

  <!-- Product Label Banner -->
  <rect x="15" y="152" width="170" height="32" rx="12" fill="#ca8a04" filter="url(#vanShadow)"/>
  <text x="100" y="173" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHOCOLATOS VANILLA</text>
</svg>
