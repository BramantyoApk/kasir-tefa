<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="32" fill="url(#iceBg)"/>

  <!-- Cold frosty snowflakes in background -->
  <circle cx="160" cy="40" r="14" fill="#bae6fd" opacity="0.4"/>
  <path d="M160 30 L160 50 M150 40 L170 40 M153 33 L167 47 M153 47 L167 33" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="45" cy="50" r="10" fill="#bae6fd" opacity="0.4"/>
  <path d="M45 43 L45 57 M38 50 L52 50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Plastic Cup with Ice Water -->
  <g filter="url(#glassShadow)">
    <!-- Straw -->
    <path d="M120 30 L108 95" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M120 30 L132 18" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M117 32 L119 29" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Plastic Cup Outline -->
    <path d="M62 70 L74 158 Q76 166 88 166 L118 166 Q130 166 132 158 L144 70 Z" fill="#e0f2fe" opacity="0.85"/>

    <!-- Water Level Inside Cup -->
    <path d="M65 85 L74 158 Q76 166 88 166 L118 166 Q130 166 132 158 L141 85 Z" fill="url(#waterGrad)" opacity="0.75"/>

    <!-- Cup Rim & Lip -->
    <ellipse cx="103" cy="70" rx="41" ry="8" fill="#bae6fd"/>
    <ellipse cx="103" cy="70" rx="36" ry="6" fill="#38bdf8"/>

    <!-- Ice Cubes Floating in Glass -->
    <rect x="80" y="88" width="22" height="20" rx="4" fill="#ffffff" opacity="0.85" transform="rotate(-8 91 98)"/>
    <rect x="108" y="96" width="20" height="20" rx="4" fill="#ffffff" opacity="0.9" transform="rotate(18 118 106)"/>
    <rect x="86" y="118" width="22" height="22" rx="4" fill="#ffffff" opacity="0.8" transform="rotate(6 97 129)"/>

    <!-- Condensation Drops on Glass -->
    <circle cx="75" cy="110" r="2.5" fill="#ffffff"/>
    <circle cx="78" cy="130" r="2" fill="#ffffff"/>
    <circle cx="128" cy="120" r="2.5" fill="#ffffff"/>
    <circle cx="125" cy="140" r="2" fill="#ffffff"/>
  </g>

  <!-- Product Label Banner -->
  <rect x="15" y="152" width="170" height="32" rx="12" fill="#0284c7" filter="url(#glassShadow)"/>
  <text x="100" y="173" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AIR ES (GELAS PLASTIK)</text>
</svg>
